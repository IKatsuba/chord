name: Feature request
description: Something chord should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The work you were doing when you missed it, and how you get by today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What chord could do
      description: How it would look on screen and which key it would take, if you have an idea.
