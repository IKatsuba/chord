name: ci

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Every platform's packages, as the compile installs them, and the
      # switch that has lint/libfx_assets_test.ts check all four installed
      # before a binary is built from them; locally it checks the host's
      # alone (CHD-603).
      - run: bun install --frozen-lockfile --os='*' --cpu='*' --libc='*'
      - run: bun quality --static
        env:
          CHORD_LIBFX_ALL_TARGETS: '1'

  # The suite in three, each test file in exactly one: Bun's --shard cuts
  # the sorted files by the times in tests/timings.json (CHD-513).
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Captured-name tests run zsh, macOS's default shell.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun dev test --shard=${{ matrix.shard }}/3

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun dev compile

  # The check branch protection requires by name: it passes only when the
  # static checks, every shard and the compile did, as one job did before.
  check:
    needs: [static, tests, compile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.static.result }}' = success
          test '${{ needs.tests.result }}' = success
          test '${{ needs.compile.result }}' = success
