# The port's CI, modelled on the original's ci.yml, on ubuntu-latest alone
# (Q380): the static checks, both suites in three shards, the compile tags,
# the npm shim's node test, the release's Linux targets compiled, the site,
# and packages/cursor-cloud-acp's TypeScript checks on Bun. It
# reads the repository and nothing else: no secret, no signing, no upload,
# no release. darwin is built by the owner's local release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
      # The root's analysis reaches site/, which resolves its own packages.
      - run: dart pub get
        working-directory: site
      - run: dart analyze
      - run: dart analyze
        working-directory: packages/chord_tui
      - run: dart format --output=none --set-exit-if-changed .
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Both suites in three, each test file in exactly one shard: every n-th
  # of the sorted files, as tool/shards.dart cuts them (CTUI-146).
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
      - name: the app's shard
        shell: bash
        run: >-
          dart run tool/shards.dart --package=. --shard=${{ matrix.shard }}/3
          | xargs dart test
      - name: the framework's shard
        shell: bash
        run: >-
          dart run tool/shards.dart --package=packages/chord_tui
          --shard=${{ matrix.shard }}/3
          | (cd packages/chord_tui && xargs dart test)

  # The compile tags of both packages, their pty cases driven by expect,
  # and the framework's Wasm build run under Node.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
      - run: dart test -t compile --run-skipped
      - run: dart test -t compile --run-skipped
        working-directory: packages/chord_tui

  # The npm shim on the Node its engines name, from 22.13.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
      - run: dart test test/tool/npm_test.dart

  # The release's Linux targets: linux-x64 compiled natively and run for
  # --version, linux-arm64 cross-compiled and checked to be its kind.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
      - run: dart run tool/ci.dart linux-x64
      - run: dart run tool/ci.dart linux-arm64

  # The site: its static checks and VM tests, a build at the root base, its
  # build and browser tags, and the framework's web terminal, in the
  # runner's own Chrome.
  site:
    runs-on: ubuntu-latest
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
        working-directory: packages/chord_tui
      - run: dart pub get
        working-directory: site
      - run: dart analyze
        working-directory: site
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: site
      - run: dart test
        working-directory: site
      - run: dart run tool/build.dart build
        working-directory: site
      - run: dart test -t compile --run-skipped
        working-directory: site
      - run: dart test -t browser --run-skipped
        working-directory: site
      - run: dart test -t browser --run-skipped
        working-directory: packages/chord_tui

  # packages/cursor-cloud-acp, still TypeScript and on npm: its quality
  # checks, then the tests of the root tooling its release runs on.
  cursor-cloud-acp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: bun install --frozen-lockfile
      - run: bun dev quality cursor-cloud-acp
      - run: bun test ./tests/scripts ./lint

  # The check branch protection requires by name: it passes only when the
  # static checks, every shard, the compile tags, the node test, the
  # release's targets, the site and cursor-cloud-acp's job did.
  check:
    needs: [static, tests, compile, node, release, site, cursor-cloud-acp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.static.result }}' = success
          test '${{ needs.tests.result }}' = success
          test '${{ needs.compile.result }}' = success
          test '${{ needs.node.result }}' = success
          test '${{ needs.release.result }}' = success
          test '${{ needs.site.result }}' = success
          test '${{ needs.cursor-cloud-acp.result }}' = success
