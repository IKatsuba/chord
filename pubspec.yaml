name: chord
description: chord, the full-screen terminal client for ACP coding agents, ported to Dart on chord_tui.
version: 0.72.1
publish_to: none

environment:
  sdk: ^3.12.0
dependencies:
  args: ^2.7.0
  async: ^2.13.1
  path: ^1.9.1
  pub_semver: ^2.2.1
  process_run: ^1.4.4
  chord_tui:
    path: packages/chord_tui
  json_rpc_2: ^4.1.0
  stream_channel: ^2.1.4
  cancellation_token: ^2.0.1
  characters: ^1.4.1
  clock: ^1.1.2
  collection: ^1.19.1
  crypto: ^3.0.8
  color_models: 2.0.0
  uuid: 4.6.0
  xdg_directories: 1.1.0
  intl: ^0.20.3
  mime: ^2.1.0
  json_schema: 5.2.2
  punycoder: 0.3.0
  mcp_dart: 2.4.4
  yaml: 3.1.4
  http: ^1.6.0
